name: Archetype Catalogue Contract Quality

on:
  push:
    paths:
      - "Engine/catalog/archetype_catalog/**"
      - ".github/workflows/archetype-catalog-quality.yml"
  pull_request:
    paths:
      - "Engine/catalog/archetype_catalog/**"
      - ".github/workflows/archetype-catalog-quality.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install catalogue runtime dependencies
        run: python -m pip install "openai>=1.0" "python-dotenv>=1.0"
      - name: Compile archetype catalogue package
        run: python -m compileall Engine/catalog/archetype_catalog
      - name: Run archetype catalogue contract tests
        env:
          PYTHONPATH: .
        run: python -m unittest discover -s Engine/catalog/archetype_catalog -p "test_*.py" -v
