name: ExamHub Phase 8 Controlled Live Pilot
on:
  workflow_dispatch:
    inputs:
      confirm_live:
        description: Type INSERT_5_DRAFTS to authorize the live pilot
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: examhub-chapter-generation
  cancel-in-progress: false
jobs:
  live-pilot:
    if: ${{ inputs.confirm_live == 'INSERT_5_DRAFTS' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5' }}
      MASTER_CHAPTER_CODE: A1_CH2
      QUESTION_COUNT: '5'
      QUESTION_DIFFICULTY: S1
      DRY_RUN: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check required secrets
        run: |
          test -n "$OPENAI_API_KEY"
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_SERVICE_ROLE_KEY"
      - name: Install SDK
        run: python -m pip install 'openai>=1,<3'
      - name: Generate and verify five unpublished drafts
        run: python -m Engine.integration.live_pilot
      - name: Commit CIRE catalog if generated
        if: success()
        run: |
          git add Engine/catalog/cire/master/
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Record CIRE catalog for Phase 8 pilot'
            git push origin HEAD:main
          fi
      - name: Upload pilot verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase8-live-pilot-report
          path: artifacts/live_pilot_report.json
          if-no-files-found: warn
          retention-days: 30
