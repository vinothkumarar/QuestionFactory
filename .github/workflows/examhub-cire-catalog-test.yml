name: ExamHub CIRE Catalog Reuse Test
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cire-catalog-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test persistent Concept QP Archetype ID reuse
        run: python -m Engine.integration.cire_catalog_store
