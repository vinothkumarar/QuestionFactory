name: ExamHub Master Catalog Pipeline (Dry Run)
on:
  workflow_dispatch:
    inputs:
      subtopic:
        description: Canonical Master Syllabus subtopic code
        required: true
        default: A1_CH1_ST1
      concept_limit:
        description: Concepts to process (1-5)
        required: true
        type: number
        default: 1
permissions:
  contents: read
jobs:
  catalog-dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5' }}
      MASTER_SUBTOPIC_CODE: ${{ inputs.subtopic }}
      CATALOG_CONCEPT_LIMIT: ${{ inputs.concept_limit }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify secrets
        run: |
          test -n "$OPENAI_API_KEY"
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_SERVICE_ROLE_KEY"
      - name: Install OpenAI SDK
        run: python -m pip install 'openai>=1,<3'
      - name: Generate Concept QP Archetype chain without database writes
        run: python -m Engine.integration.master_catalog_pipeline
