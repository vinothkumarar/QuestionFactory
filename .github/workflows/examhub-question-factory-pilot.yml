name: ExamHub Live Master Syllabus Pilot
on:
  workflow_dispatch:
    inputs:
      subtopic:
        description: Canonical Master Syllabus subtopic code
        required: true
        default: A1_CH1_ST1
      count:
        description: Number of S1 Easy draft questions (1-20)
        required: true
        type: number
        default: 5
permissions:
  contents: read
jobs:
  generate-and-stage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: examhub-pilot
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5' }}
      MASTER_SUBTOPIC_CODE: ${{ inputs.subtopic }}
      QUESTION_COUNT: ${{ inputs.count }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check secrets
        run: |
          test -n "$OPENAI_API_KEY"
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_SERVICE_ROLE_KEY"
      - name: Install OpenAI SDK
        run: python -m pip install 'openai>=1,<3'
      - name: Generate S1 questions from live Master Syllabus and stage drafts
        run: python -m Engine.integration.master_syllabus_pilot
