name: ExamHub Controlled Chapter Generation
on:
  workflow_dispatch:
    inputs:
      chapter:
        description: Canonical Master Syllabus chapter code (e.g. A1_CH1)
        required: true
        default: A1_CH1
      subtopic_limit:
        description: Maximum subtopics in this run (1-20)
        required: true
        type: number
        default: 3
      subtopic_offset:
        description: Skip first N subtopics (0 for beginning, 3 for ST4 onward)
        required: true
        type: number
        default: 0
      expected_first_subtopic:
        description: Safety check first target code (e.g. A1_CH1_ST4); leave blank to skip
        required: false
        type: string
        default: ""
      count:
        description: Draft questions per subtopic (1-20)
        required: true
        type: number
        default: 5
      dry_run:
        description: Validate only; do not insert into Supabase
        required: true
        type: boolean
        default: true
permissions:
  contents: write
concurrency:
  group: examhub-chapter-generation
  cancel-in-progress: false
jobs:
  validate-or-stage:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5' }}
      MASTER_CHAPTER_CODE: ${{ inputs.chapter }}
      SUBTOPIC_LIMIT: ${{ inputs.subtopic_limit }}
      SUBTOPIC_OFFSET: ${{ inputs.subtopic_offset }}
      EXPECTED_FIRST_SUBTOPIC: ${{ inputs.expected_first_subtopic }}
      QUESTION_COUNT: ${{ inputs.count }}
      DRY_RUN: ${{ inputs.dry_run }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify secrets
        run: |
          test -n "$OPENAI_API_KEY"
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_SERVICE_ROLE_KEY"
      - name: Install SDK
        run: python -m pip install 'openai>=1,<3'
      - name: Generate and validate chapter subtopics
        run: python -m Engine.integration.master_syllabus_bulk
      - name: Upload question generation summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: question-factory-run-summary
          path: artifacts/question_factory_run_summary.json
          if-no-files-found: warn
          retention-days: 30
      - name: Persist CIRE catalog after live generation
        if: ${{ success() && !inputs.dry_run }}
        run: |
          if [ -n "$(git status --porcelain -- Engine/catalog/cire/master)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add Engine/catalog/cire/master
            git commit -m "Persist discovered CIRE QP possibilities and accepted coverage"
            git push origin HEAD:main
          else
            echo "No catalog changes to persist."
          fi
