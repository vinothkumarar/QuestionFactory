name: ExamHub Master Syllabus Traversal
on:
  workflow_dispatch:
    inputs:
      subject:
        description: Master subject code or ALL
        required: true
        default: A1
      difficulty:
        description: Difficulty
        required: true
        type: choice
        options: [S1, S2, S3, S4]
        default: S1
      generation_round:
        description: Round number
        required: true
        type: number
        default: 1
      subtopic_limit:
        description: Subtopics per batch (1-20)
        required: true
        type: number
        default: 1
      count:
        description: Questions per subtopic (1-20)
        required: true
        type: number
        default: 1
      max_batches:
        description: Maximum batches in this run (1-20)
        required: true
        type: number
        default: 2
      resume:
        description: Resume saved matching checkpoint
        required: true
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: examhub-chapter-generation
  cancel-in-progress: false
jobs:
  master-traversal:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5' }}
      MASTER_SUBJECT_CODE: ${{ inputs.subject }}
      QUESTION_DIFFICULTY: ${{ inputs.difficulty }}
      GENERATION_ROUND: ${{ inputs.generation_round }}
      SUBTOPIC_LIMIT: ${{ inputs.subtopic_limit }}
      QUESTION_COUNT: ${{ inputs.count }}
      MAX_BATCHES: ${{ inputs.max_batches }}
      RESUME: ${{ inputs.resume }}
      DRY_RUN: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check required secrets
        run: |
          test -n "$OPENAI_API_KEY"
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_SERVICE_ROLE_KEY"
      - name: Install SDK
        run: python -m pip install 'openai>=1,<3'
      - name: Traverse Master syllabus
        run: python -m Engine.integration.master_traversal
      - name: Upload traversal summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: master-traversal-summary
          path: |
            artifacts/master_traversal_summary.json
            artifacts/question_factory_run_summary.json
          if-no-files-found: warn
          retention-days: 30
